<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>ATK / DEF シミュレーター</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.png">
  <script src="script.js" defer></script>
  <script src="json.js" defer></script>
</head>
<body>
<nav class="tabs" aria-label="メインナビゲーション">
  <a href="index.html" class="tab active" aria-current="page">計算</a>
  <a href="spec.html" class="tab">使い方・計算式</a>
  <a href="comment.html" class="tab">コメント</a>
</nav>
<header class="page-header">
  <img src="icon.png" alt="" width="46" height="46">
  <div><h1>ATK / DEF シミュレーター</h1><p>ドッカンバトル</p></div>
</header>
<main class="container">
<form id="calculatorForm" class="form-sections">
  <section class="section">
    <div class="section-heading"><h2>キャラクター・基礎値</h2><a href="#results">計算結果へ</a></div>
    <div class="field-grid">
      <label for="nickname">二つ名<input type="text" id="nickname" maxlength="100" placeholder="例：謎の仙人"></label>
      <label for="charName">名前<input type="text" id="charName" maxlength="100" placeholder="例：ジャッキー・チュン"></label>
      <label for="baseAtk">基礎ATK<input type="number" id="baseAtk" value="" min="0" max="999999" step="1" placeholder="20000"></label>
      <label for="baseDef">基礎DEF<input type="number" id="baseDef" value="" min="0" max="999999" step="1" placeholder="15000"></label>
      <label for="leaderSkill">自前リーダー（%）<input type="number" id="leaderSkill" value="220" min="0" max="1000000" step="0.01"></label>
      <label for="friendLeaderSkill">フレンドリーダー（%）<input type="number" id="friendLeaderSkill" value="220" min="0" max="1000000" step="0.01"></label>
    </div>
  </section>
  <section class="section">
    <h2>補正倍率（%）</h2>
    <div class="buff-grid"><span></span><span class="col-heading">ATK</span><span class="col-heading">DEF</span>
      <span>フィールド</span><input type="number" id="fieldAtk" value="0" min="0" max="1000000" step="0.01" aria-label="フィールド ATK（%）"><input type="number" id="fieldDef" value="0" min="0" max="1000000" step="0.01" aria-label="フィールド DEF（%）">
<span>メモリー・アイテム</span><input type="number" id="supportAtk" value="0" min="0" max="1000000" step="0.01" aria-label="メモリー・アイテム ATK（%）"><input type="number" id="supportDef" value="0" min="0" max="1000000" step="0.01" aria-label="メモリー・アイテム DEF（%）">
<span>アクティブ</span><input type="number" id="activeAtk" value="0" min="0" max="1000000" step="0.01" aria-label="アクティブ ATK（%）"><input type="number" id="activeDef" value="0" min="0" max="1000000" step="0.01" aria-label="アクティブ DEF（%）">
<span>リンク</span><input type="number" id="linkAtk" value="0" min="0" max="1000000" step="0.01" aria-label="リンク ATK（%）"><input type="number" id="linkDef" value="0" min="0" max="1000000" step="0.01" aria-label="リンク DEF（%）">
<span>味方パッシブ支援</span><input type="number" id="allyAtk" value="0" min="0" max="1000000" step="0.01" aria-label="味方パッシブ支援 ATK（%）"><input type="number" id="allyDef" value="0" min="0" max="1000000" step="0.01" aria-label="味方パッシブ支援 DEF（%）">
    </div>
    <label for="allyTiming">味方パッシブ支援の区分</label>
    <select id="allyTiming"><option value="1">足し算パッシブ</option><option value="2">掛け算パッシブ</option></select>
  </section>
  <section class="section">
    <div class="section-heading"><h2>パッシブスキル</h2><a href="spec.html#passive">判定ルール</a></div>
    <label for="passiveMode">入力方法</label>
    <select id="passiveMode"><option value="auto">テキストから解析</option><option value="manual">倍率を直接入力</option></select>
    <label for="passiveSkill">有効なパッシブ</label>
    <textarea id="passiveSkill" maxlength="10000" placeholder="基本効果&#10;ATK/DEF200%UP&#10;攻撃時&#10;ATK100%UP"></textarea>
    <div class="field-grid passive-summary">
      <label for="passive1Atk">足し算 ATK（%）<input type="number" id="passive1Atk" value="0" min="0" max="1000000" step="0.01"></label>
      <label for="passive1Def">足し算 DEF（%）<input type="number" id="passive1Def" value="0" min="0" max="1000000" step="0.01"></label>
      <label for="passive2Atk">掛け算 ATK（%）<input type="number" id="passive2Atk" value="0" min="0" max="1000000" step="0.01"></label>
      <label for="passive2Def">掛け算 DEF（%）<input type="number" id="passive2Def" value="0" min="0" max="1000000" step="0.01"></label>
    </div>
    <p id="passiveWarning" class="notice" role="status"></p>
  </section>
  <section class="section">
    <h2>必殺技の共通設定</h2>
    <div class="field-grid">
      <label for="superPowerLv">潜在能力・必殺技威力UP Lv<input type="number" id="superPowerLv" value="0" min="0" max="1000" step="1"></label>
      <label for="attackOrder">発動順<select id="attackOrder"><option value="ultra-first">超必殺 → 必殺</option><option value="normal-first">必殺 → 超必殺</option></select></label>
      <label for="previousAtkEffect">持ち越し必殺効果 ATK（%）<input type="number" id="previousAtkEffect" value="0" min="0" max="1000000" step="0.01"></label>
      <label for="previousDefEffect">持ち越し必殺効果 DEF（%）<input type="number" id="previousDefEffect" value="0" min="0" max="1000000" step="0.01"></label>
    </div>
  </section>
  <div class="attack-sections"><section class="section">
<h2>必殺技</h2>
<label for="normalCount">発動回数<input type="number" id="normalCount" value="1" min="0" max="20" step="1"></label>
<label for="normalKiBonus">気力倍率<input type="number" id="normalKiBonus" value="1.5" min="0.01" max="10" step="0.01"></label>
<label for="normalMultiplier">必殺技倍率（追加ボーナスを除く）<input type="number" id="normalMultiplier" value="3.95" min="0" max="1000" step="0.01" list="multiplierValues"></label>
<label for="normalPlus">技レベル到達ボーナス</label>
<select id="normalPlus"><option value="0">なし</option><option value="0.2">威力アップ（+0.20）</option><option value="0.3" selected>威力大アップ（+0.30）</option></select>
<label for="normalAtkEffect">必殺効果・ATK（%）</label>
<select id="normalAtkEffect"><option value="0">なし</option><option value="20">20%上昇</option><option value="30">30%上昇</option><option value="50">50%上昇</option><option value="100">100%上昇</option><option value="custom">自由入力</option></select>
<input type="number" id="normalCustomAtk" class="hidden" min="0" max="1000000" step="0.01" aria-label="必殺 ATK上昇率">
<label for="normalDefEffect">必殺効果・DEF（%）</label>
<select id="normalDefEffect"><option value="0">なし</option><option value="20">20%上昇</option><option value="30">30%上昇</option><option value="50">50%上昇</option><option value="100">100%上昇</option><option value="custom">自由入力</option></select>
<input type="number" id="normalCustomDef" class="hidden" min="0" max="1000000" step="0.01" aria-label="必殺 DEF上昇率">
</section>
<section class="section">
<h2>超必殺技</h2>
<label for="ultraCount">発動回数<input type="number" id="ultraCount" value="0" min="0" max="20" step="1"></label>
<label for="kiBonus">気力倍率<input type="number" id="kiBonus" value="2" min="0.01" max="10" step="0.01"></label>
<label for="ultraMultiplier">必殺技倍率（追加ボーナスを除く）<input type="number" id="ultraMultiplier" value="5.4" min="0" max="1000" step="0.01" list="multiplierValues"></label>
<label for="ultraPlus">技レベル到達ボーナス</label>
<select id="ultraPlus"><option value="0">なし</option><option value="0.2">威力アップ（+0.20）</option><option value="0.3" selected>威力大アップ（+0.30）</option></select>
<label for="ultraAtkEffect">必殺効果・ATK（%）</label>
<select id="ultraAtkEffect"><option value="0">なし</option><option value="20">20%上昇</option><option value="30">30%上昇</option><option value="50">50%上昇</option><option value="100">100%上昇</option><option value="custom">自由入力</option></select>
<input type="number" id="ultraCustomAtk" class="hidden" min="0" max="1000000" step="0.01" aria-label="超必殺 ATK上昇率">
<label for="ultraDefEffect">必殺効果・DEF（%）</label>
<select id="ultraDefEffect"><option value="0">なし</option><option value="20">20%上昇</option><option value="30">30%上昇</option><option value="50">50%上昇</option><option value="100">100%上昇</option><option value="custom">自由入力</option></select>
<input type="number" id="ultraCustomDef" class="hidden" min="0" max="1000000" step="0.01" aria-label="超必殺 DEF上昇率">
</section></div>
  <datalist id="multiplierValues">
    <option value="3.95">極大 Lv.20</option><option value="4.2">極大 Lv.25</option>
    <option value="5.4">超極大 Lv.20</option><option value="5.9">超極大 Lv.25</option>
    <option value="5.05">超絶特大 Lv.10</option><option value="6.3">超絶特大 Lv.15</option>
  </datalist>
  <div class="calculate-bar"><button type="submit" id="calculateButton">計算する</button></div>
  <p id="calculationError" class="notice error" role="alert"></p>
  <div class="file-area">
    <div class="file-buttons">
      <button type="button" id="saveButton" class="btn">JSON保存</button>
      <button type="button" id="loadButton" class="btn">JSON読み込み</button>
      <input type="file" id="fileLoader" accept=".json,application/json" hidden>
    </div>
    <div class="file-name-box"><span id="fileName">未選択</span></div>
    <p id="fileStatus" role="status"></p>
  </div>
</form>
<aside class="result-panel" id="results" aria-labelledby="resultHeading">
  <h2 id="resultHeading">計算結果</h2>
  <p id="resultStatus" class="muted" role="status">未計算</p>
  <div class="result-values" aria-live="polite">
    <div><span class="result-label">合計ATK</span><output id="resultAtk" class="result-value">—</output></div>
    <div><span class="result-label">最終DEF</span><output id="resultDef" class="result-value">—</output></div>
  </div>
  <p class="muted">表示ATKの合計です。敵に与えるダメージではありません。</p>
  <details open><summary>攻撃ごとの内訳</summary><pre id="detail">未計算</pre></details>
  <details>
    <summary>耐久の参考値</summary>
    <label for="damageReduction">ダメージ軽減率（%）</label>
    <input type="number" id="damageReduction" value="0" min="0" max="100" step="0.01" form="calculatorForm">
    <label class="dokkan-check"><input type="checkbox" id="guard" form="calculatorForm">全属性ガード</label>
    <p class="muted">旧計算式による目安。敵側の補正・乱数は未対応です。</p>
    <div id="hpResult">未計算</div>
  </details>
  <a href="spec.html#formula" class="muted">計算式・対応範囲</a>
</aside>
</main>
</body>
</html>
